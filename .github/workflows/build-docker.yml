---
name: Docker CI

on:
  push:
    branches:
      - master
      - main
    paths:
      - ".github/workflows/build-docker.yml"
      - ".dockerignore"
      - "docker/ubuntu24/**"
      - "scripts/docker-build-24.sh"
      - "scripts/docker-test.sh"
      - "scripts/docker-validate.sh"
      - "scripts/docker-env.sh"
      - "scripts/run-ansible.sh"
      - "Pipfile"
      - "Pipfile.lock"
      - "package.json"
      - "package-lock.json"
      - "dockerd-entrypoint.sh"
      - "modprobe.sh"
  schedule:
    - cron: "0 6 * * 3"
  pull_request:
    branches: [master, main]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/build-docker.yml"
      - ".dockerignore"
      - "docker/ubuntu24/**"
      - "scripts/docker-build-24.sh"
      - "scripts/docker-test.sh"
      - "scripts/docker-validate.sh"
      - "scripts/docker-env.sh"
      - "scripts/run-ansible.sh"
      - "Pipfile"
      - "Pipfile.lock"
      - "package.json"
      - "package-lock.json"
      - "dockerd-entrypoint.sh"
      - "modprobe.sh"

permissions:
  contents: read
  security-events: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: nabla/ansible-jenkins-slave-docker
  PYTHON_VERSION: "3.13.15"
  NODE_VERSION: "25.9.0"
  NPM_VERSION: "11.17.0"
  ANSIBLE_CORE_VERSION: "2.21.4"
  PIPENV_VERSION: "2026.8.0"
  CST_VERSION: "1.22.1"
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
  build-docker:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    name: Build Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "ansible-core==${ANSIBLE_CORE_VERSION}" \
            "pipenv==${PIPENV_VERSION}"
          python --version
          pip --version
          ansible --version
          pipenv --version

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Upgrade npm and install Node CI tools
        run: |
          npm install --global "npm@${NPM_VERSION}" markdown-toc@latest secretlint@latest
          node --version
          npm --version
          markdown-toc --version || true
          secretlint --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build with canonical Ubuntu 24 script
        env:
          CI: "true"
          RUN_ANSIBLE_SETUP: "false"
          DOCKER_TAG: ${{ github.sha }}
          DOCKER_BUILD_ARGS: "--pull --progress=plain"
        run: |
          set -o pipefail
          bash scripts/docker-build-24.sh 2>&1 | tee docker-build.log

      - name: Summarize Docker build failure
        if: failure() && hashFiles('docker-build.log') != ''
        run: |
          {
            echo "### Docker build failure — last 200 lines"
            echo '```text'
            tail -n 200 docker-build.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate Ubuntu 24 image contract
        env:
          CST_CONFIG: docker/ubuntu24/config.yaml
        run: bash scripts/docker-test.sh ansible-jenkins-slave-docker "${GITHUB_SHA}"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.71.2
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          skip-dirs: .direnv,.venv,home/jenkins/go/
          skip-files: Gemfile.lock,Pipfile.lock,package-lock.json,requirements.txt,docker/ubuntu16/Dockerfile,docker/ubuntu18/Dockerfile,/usr/bin/nomad
          timeout: "30m0s"
          vuln-type: library
          severity: CRITICAL

      - name: Upload Trivy scan results
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-results.sarif

      - name: Login to DockerHub
        if: github.event_name != 'pull_request' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Push DockerHub image
        if: github.event_name != 'pull_request' && env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        run: |
          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"
