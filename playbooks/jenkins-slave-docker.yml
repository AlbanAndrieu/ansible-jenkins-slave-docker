---
# see https://blog.trifork.com/2013/04/02/ansible-example-playbook-to-setup-jenkins-slave/

# as root
# ansible-playbook jenkins-slave-docker.yml -i hosts -vvvv
# as albandri
# ansible-playbook jenkins-slave-docker.yml -i hosts -vvvv --ask-become-pass
# --extra-vars "jenkins_username=aandrieu jenkins_password=tbd"
# for testing purpose
# ansible-playbook -i inventory/hosts -c local -v playbooks/jenkins-slave-docker.yml --check --diff --ask-become-pass -vvvv

- name: Assert platform is supported
  hosts: all
  remote_user: root
  gather_facts: true

  tasks:
    - name: Assert platform is supported
      assert:
        that:
          - ansible_os_family in ['Debian', 'RedHat', 'CentOS', 'Windows', 'Solaris']
          - ansible_architecture in ['x86_64']

- name: Group hosts by distribution
  hosts: all
  gather_facts: true
  tasks:
    - name: Group hosts by distribution
      group_by:
        key: "{{ ansible_distribution }}-{{ ansible_distribution_version }}"

- name: Group hosts for supported distributions
  hosts:
    RedHat-7*:RedHat-6*:RedHat-5*:CentOS-7*:CentOS-6*:Ubuntu-21*:Ubuntu-20*:Ubuntu-19*:Ubuntu-18*:Ubuntu-17*:Ubuntu-16*:Ubuntu-15*:Ubuntu-14*:Ubuntu-13*:Ubuntu-12*
  gather_facts: false
  tasks:
    - name: Group hosts for supported distributions
      group_by:
        key: "supported"

- name: Fail for unsupported distribution
  hosts: "!supported"
  gather_facts: false
  tasks:
    - name: Fail for unsupported distribution
      fail:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_version }} is not a supported OS for a Tower installation.  Supported OSes include Red Hat Enterprise Linux 6/7/5, CentOS 6/7, or Ubuntu 12.04/13.04/14.04/15.04/16.04/17.04/18.04/19.04/20.04/21.04."
    - name: Show distribution version
      debug:
        msg: "Version {{ ansible_distribution }} {{ ansible_distribution_version }} {{ ansible_architecture }}"

