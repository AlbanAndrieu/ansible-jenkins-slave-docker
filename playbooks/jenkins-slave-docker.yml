- name: Update cache
  hosts: Ubuntu-21*:Ubuntu-20*:Ubuntu-19*:Ubuntu-18*:Ubuntu-17*:Ubuntu-16*:Ubuntu-14*:Ubuntu-13*:Ubuntu-12*
  #  remote_user: root
  become: true

  tasks:
    - name: Update
      apt:
        update_cache: true
      ignore_errors: false

