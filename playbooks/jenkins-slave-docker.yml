# Below ntp role is included in administration role
- name: Apply ntp configuration
  hosts: all
  gather_facts: false
  remote_user: root
  become: true
  ignore_errors: true

  roles:
    - geerlingguy.ntp

  vars:
    ntp_timezone: Europe/Paris

