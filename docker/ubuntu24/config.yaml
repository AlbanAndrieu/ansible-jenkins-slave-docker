---
schemaVersion: "2.0.0"

globalEnvVars:
  - key: "JAVA_HOME"
    value: "/usr/lib/jvm/java-1.17.0-openjdk-amd64"

fileExistenceTests:
  - name: "root filesystem"
    path: "/"
    shouldExist: true

  - name: "python3"
    path: "/usr/bin/python3"
    shouldExist: true

  - name: "uv"
    path: "/usr/local/bin/uv"
    shouldExist: true

  - name: "no pip: Python tools come from uv"
    path: "/usr/bin/pip3"
    shouldExist: false

  - name: "node"
    path: "/usr/bin/node"
    shouldExist: true

  - name: "npm"
    path: "/usr/bin/npm"
    shouldExist: true

  - name: "docker client"
    path: "/usr/bin/docker"
    shouldExist: true

  - name: "docker buildx plugin"
    path: "/usr/libexec/docker/cli-plugins/docker-buildx"
    shouldExist: true

  - name: "no Docker daemon in the runner"
    path: "/usr/bin/dockerd"
    shouldExist: false

  - name: "container structure test"
    path: "/usr/local/bin/container-structure-test"
    shouldExist: true

  - name: "trivy"
    path: "/usr/local/bin/trivy"
    shouldExist: true

  - name: "go"
    path: "/usr/local/go/bin/go"
    shouldExist: true

  - name: "GitHub Actions runner owned by the runtime user"
    path: "/opt/actions-runner/run.sh"
    shouldExist: true
    uid: 1000

  - name: "no LibreOffice"
    path: "/usr/bin/soffice"
    shouldExist: false

  - name: "no Nomad"
    path: "/bin/nomad"
    shouldExist: false

  - name: "docker credentials are not baked into the image"
    path: "/home/ubuntu/.docker/config.json"
    shouldExist: false

fileContentTests:
  - name: "no passwordless sudo to root"
    path: "/etc/sudoers"
    excludedContents: ["NOPASSWD"]

commandTests:
  - name: "git is from Ubuntu 26.04"
    command: "git"
    args: ["--version"]
    expectedOutput: ["git version 2.53.*"]

  - name: "default Python is Ubuntu 26.04 Python 3.14"
    command: "python3"
    args: ["--version"]
    expectedOutput: ["Python 3.14.*"]

  - name: "Ansible Core"
    command: "ansible"
    args: ["--version"]
    expectedOutput: ["ansible.*core 2.20.1.*"]

  - name: "Ansible Lint"
    command: "ansible-lint"
    args: ["--version"]
    # rich colours the version even without a TTY
    envVars:
      - key: "NO_COLOR"
        value: "1"
    expectedOutput: ["ansible-lint 26.10.1 using ansible-core:2.20.1"]

  - name: "PHP 8.5 from Ubuntu 26.04"
    command: "php"
    args: ["--version"]
    expectedOutput: ["PHP 8.5.*"]

  - name: "Pipenv"
    command: "pipenv"
    args: ["--version"]
    expectedOutput: ["pipenv, version 2025.0.4.*"]

  - name: "Poetry"
    command: "poetry"
    args: ["--version"]
    expectedOutput: ["Poetry.*2.1.3.*"]

  - name: "Node.js 26 LTS"
    command: "node"
    args: ["--version"]
    expectedOutput: ["v26.*"]

  - name: "npm 11"
    command: "npm"
    args: ["--version"]
    expectedOutput: ["11.20.*"]

  - name: "Docker 29.9"
    command: "docker"
    args: ["--version"]
    expectedOutput: ["Docker version 29.9.*"]

  - name: "Go 1.25.5"
    command: "/usr/local/go/bin/go"
    args: ["version"]
    expectedOutput: ["go version go1.25.5.*"]

  - name: "GitHub Actions runner 2.338.2"
    command: "/opt/actions-runner/bin/Runner.Listener"
    args: ["--version"]
    expectedOutput: ["2.338.2"]

  - name: "Trivy 0.71.2"
    command: "trivy"
    args: ["--version"]
    expectedOutput: ["Version: 0.71.2.*"]

metadataTest:
  envVars:
    - key: "TZ"
      value: "Europe/Paris"
    - key: "PATH"
      value: ".*/home/ubuntu/go/bin.*"
      isRegex: true
  unboundEnvVars:
    - key: "ANSIBLE_VAULT_PASSWORD"
    - key: "ANSIBLE_VAULT_PASS"
    - key: "CI_PIP_GITLABNABLA_TOKEN"
    - key: "CI_PIP_GITLABJUSMUNDI_TOKEN"
    - key: "DOCKER_USERNAME"
    - key: "DOCKER_PASSWORD"
  labels:
    - key: "vendor"
      value: "nabla"
  entrypoint: []
  cmd: ["/bin/bash"]
  workdir: "/tmp"
  user: "1000"
