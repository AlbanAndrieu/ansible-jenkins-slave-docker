---
schemaVersion: "2.0.0"

globalEnvVars:
  - key: "JAVA_HOME"
    value: "/usr/lib/jvm/java-1.17.0-openjdk-amd64"

fileExistenceTests:
  - name: "root filesystem"
    path: "/"
    shouldExist: true

  - name: "ubuntu local bin"
    path: "/home/ubuntu/.local/bin"
    shouldExist: true

  - name: "python3"
    path: "/usr/bin/python3"
    shouldExist: true

  - name: "legacy python 3.10"
    path: "/usr/bin/python3.10"
    shouldExist: true

  - name: "node"
    path: "/usr/bin/node"
    shouldExist: true

  - name: "npm"
    path: "/usr/bin/npm"
    shouldExist: true

  - name: "docker client"
    path: "/usr/bin/docker"
    shouldExist: true

  - name: "container structure test"
    path: "/usr/local/bin/container-structure-test"
    shouldExist: true

  - name: "trivy"
    path: "/usr/local/bin/trivy"
    shouldExist: true

  - name: "go"
    path: "/usr/local/go/bin/go"
    shouldExist: true

  - name: "nomad"
    path: "/bin/nomad"
    shouldExist: true

  - name: "docker credentials are not baked into the image"
    path: "/home/ubuntu/.docker/config.json"
    shouldExist: false

commandTests:
  - name: "git is from Ubuntu 24"
    command: "git"
    args: ["--version"]
    expectedOutput: ["git version 2.43.*"]

  - name: "default Python is Ubuntu 24 Python 3.12"
    command: "python3"
    args: ["--version"]
    expectedOutput: ["Python 3.12.*"]

  - name: "legacy Python 3.10 remains available"
    command: "python3.10"
    args: ["--version"]
    expectedOutput: ["Python 3.10.*"]

  - name: "Ansible Core"
    command: "ansible"
    args: ["--version"]
    expectedOutput: ["ansible.*core 2.17.*"]

  - name: "Pipenv"
    command: "pipenv"
    args: ["--version"]
    expectedOutput: ["pipenv, version 2025.0.4.*"]

  - name: "Poetry"
    command: "/opt/poetry/bin/poetry"
    args: ["--version"]
    expectedOutput: ["Poetry.*2.1.3.*"]

  - name: "Node.js 25"
    command: "node"
    args: ["--version"]
    expectedOutput: ["v25.*"]

  - name: "npm 11"
    command: "npm"
    args: ["--version"]
    expectedOutput: ["11.6.*"]

  - name: "Docker 28.3"
    command: "docker"
    args: ["--version"]
    expectedOutput: ["Docker version 28.3.*"]

  - name: "Go 1.25.5"
    command: "/usr/local/go/bin/go"
    args: ["version"]
    expectedOutput: ["go version go1.25.5.*"]

  - name: "Nomad 1.11"
    command: "nomad"
    args: ["version"]
    expectedOutput: ["Nomad v1.11.0.*"]

  - name: "Trivy 0.69"
    command: "trivy"
    args: ["--version"]
    expectedOutput: ["Version: 0.69.0.*"]

metadataTest:
  envVars:
    - key: "TZ"
      value: "Europe/Paris"
    - key: "PATH"
      value: ".*/home/ubuntu/go/bin.*"
      isRegex: true
  unboundEnvVars:
    - "ANSIBLE_VAULT_PASSWORD"
    - "ANSIBLE_VAULT_PASS"
    - "CI_PIP_GITLABNABLA_TOKEN"
    - "CI_PIP_GITLABJUSMUNDI_TOKEN"
    - "DOCKER_USERNAME"
    - "DOCKER_PASSWORD"
  labels:
    - key: "vendor"
      value: "nabla"
  entrypoint: ["dockerd-entrypoint.sh"]
  cmd: ["/bin/bash"]
  workdir: "/tmp"
